kind = "web"
previewPath = "/"
title = "Hicham Bel Houcin — Portfolio"
description = "A responsive single-page portfolio for full-stack engineer Hicham Bel Houcin, featuring experience, projects, skills, education, and direct contact."
version = "1.0.0"
id = "artifacts/hicham-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22839

[services.development]
run = "pnpm --filter @workspace/hicham-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hicham-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/hicham-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22839"
BASE_PATH = "/"
