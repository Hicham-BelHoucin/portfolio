<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Hicham Bel Houcin — Full-Stack Engineer</title>
  <desc id="description">A portfolio card for Hicham Bel Houcin, a full-stack engineer based in Casablanca, Morocco.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111116" />
      <stop offset="1" stop-color="#171720" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#29e5d5" />
      <stop offset="1" stop-color="#7bf0e5" />
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".2" />
      <stop offset="1" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)" />
  <circle cx="1010" cy="265" r="400" fill="url(#glow)" />
  <circle cx="1020" cy="280" r="250" fill="none" stroke="#7375ff" stroke-opacity=".14" />
  <circle cx="1020" cy="280" r="190" fill="none" stroke="#7375ff" stroke-opacity=".14" />
  <circle cx="1020" cy="280" r="130" fill="none" stroke="#7375ff" stroke-opacity=".17" />
  <image x="76" y="68" width="52" height="52" href="data:image/png;base64," />
  <circle cx="157" cy="94" r="5" fill="#29e5d5" />
  <text x="174" y="100" fill="#b9b9c7" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1.8">PORTFOLIO · CASABLANCA, MOROCCO</text>
  <text x="76" y="264" fill="#f6f6fa" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">Hicham Bel Houcin</text>
  <text x="79" y="325" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600">Full-Stack Engineer</text>
  <text x="79" y="385" fill="#c5c5d0" font-family="Arial, Helvetica, sans-serif" font-size="20">Fast, SEO-friendly products — from NestJS to Next.js.</text>
  <path d="M79 514h1042" stroke="#ffffff" stroke-opacity=".12" />
  <text x="79" y="558" fill="#a4a4b2" font-family="Arial, Helvetica, sans-serif" font-size="16">Next.js · NestJS · Prisma · PostgreSQL</text>
  <text x="1121" y="558" fill="#29e5d5" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="end">OPEN TO WORK</text>
</svg>
